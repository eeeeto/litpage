*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
:root{
  --paper:#f4f4f3;
  --ink:#171716;
  --ink2:#4b4b49;
  --mute:#9a9a97;
  --mute2:#c2c1bd;
  --line:#e7e7e5;
  --line2:#efefed;
  --script:'GV Script','Snell Roundhand','Kaiti SC','STKaiti','KaiTi','楷体',cursive;
  --hei:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei','Source Han Sans SC',system-ui,sans-serif;
  --song:'Songti SC','STSong','Noto Serif SC','Noto Serif CJK SC',SimSun,Georgia,serif;
  --script-cn:'Kaiti SC','STKaiti',KaiTi,'楷体','Songti SC',serif;
}
body{
  font-family:var(--hei);
  color:var(--ink);
  background-color:var(--paper);
  background-image:
    radial-gradient(700px 430px at 10% -10%, #ffffff 0%, rgba(255,255,255,0) 64%),
    radial-gradient(560px 420px at 94% 0%, #ebebe9 0%, rgba(235,235,233,0) 62%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
button{font-family:inherit}
[contenteditable]{outline:none}

/* ================= welcome ================= */
#welcome{
  min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:46px 20px;gap:0;position:relative;z-index:1;
  animation:fadeUp .5s ease both;
}
.w-brand{
  font-family:var(--script);font-size:60px;line-height:1.1;color:#211f1b;
  letter-spacing:.005em;margin-bottom:6px;
}
.w-tag{
  font-size:12px;letter-spacing:.34em;color:var(--mute);margin:0 0 30px;
  text-transform:uppercase;padding-left:.34em;
}
.w-card{
  width:min(382px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;
  padding:28px 24px 22px;
  box-shadow:0 1px 1px rgba(60,50,35,.03),0 26px 54px -32px rgba(60,50,35,.45);
}
.w-card h1{
  font-family:var(--hei);font-size:21px;font-weight:600;letter-spacing:.01em;
  margin:0 0 7px;line-height:1.4;
}
.w-sub{font-size:12.5px;color:var(--mute);margin:0 0 22px;line-height:1.6}
.w-label{display:block;font-size:11px;color:var(--mute);letter-spacing:.12em;margin-bottom:8px}
.w-input{
  width:100%;height:52px;border-radius:14px;border:1px solid var(--line);background:#fbf9f5;
  padding:0 15px;font-size:17px;font-family:var(--hei);color:var(--ink);outline:none;
  transition:border-color .2s,background .2s,box-shadow .2s;
}
.w-input::placeholder{color:#c9c1b3;font-family:var(--hei);font-size:14px}
.w-input:focus{border-color:#cfc5b2;background:#fff;box-shadow:0 0 0 4px rgba(205,193,171,.16)}
.w-input.shake{animation:shake .38s ease}
.w-btn{width:100%;margin-top:14px}
.w-resume{
  width:100%;margin-top:10px;background:none;border:0;color:var(--mute);font-size:12.5px;
  padding:8px;cursor:pointer;border-radius:10px;transition:color .2s,background .2s;
}
.w-resume:hover{color:var(--ink2);background:#faf7f0}
.w-resume b{font-weight:500;color:var(--ink2)}
.w-foot{margin:22px 0 0;font-size:11.5px;color:#b8b0a2;letter-spacing:.04em}

/* ================= buttons ================= */
.btn{
  height:48px;border-radius:14px;border:1px solid transparent;font-size:14.5px;
  cursor:pointer;transition:transform .12s,background .18s,color .18s,box-shadow .18s,border-color .18s;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;letter-spacing:.02em;
}
.btn:active{transform:scale(.985)}
.btn.dark{background:var(--ink);color:#fff;box-shadow:0 8px 20px -12px rgba(20,18,15,.9)}
.btn.dark:hover{background:#000}
.btn.ghost{background:#fff;border-color:#e0d8c8;color:var(--ink2)}
.btn.ghost:hover{background:#faf7f1;border-color:#ddd5c6}

/* ================= editor shell ================= */
#editor{display:none;position:relative;z-index:1}
#editor.on{display:block}

.chrome{
  position:fixed;top:0;left:0;right:0;height:58px;z-index:60;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;pointer-events:none;
}
.chrome>*{pointer-events:auto}
.chrome-right{display:flex;align-items:center;gap:8px}
.brand{font-family:var(--script);font-size:23px;color:#2b2823;opacity:.85;user-select:none}
.pv-btn{
  height:32px;padding:0 14px;border-radius:20px;border:1px solid var(--line);
  background:rgba(255,255,255,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  font-size:12px;color:var(--ink2);cursor:pointer;display:flex;align-items:center;gap:6px;
  transition:background .2s,color .2s,border-color .2s;
}
.pv-btn:hover{background:#fff;border-color:#dcd3c3}
.pv-btn svg{width:13px;height:13px}

.canvas{display:flex;justify-content:center;padding:62px 14px 112px}
.card{
  width:min(420px,100%);min-height:calc(100dvh - 174px);
  --ink:#171716;--ink2:#4b4b49;--mute:#9a9a97;--mute2:#c2c1bd;
  --line:#e7e7e5;--line2:#efefed;--fill:#f4f4f2;--panel:#ffffff;
  --ph:#c4c3bf;--dash:#d6d5d1;--hover:#fafafa;
  --page-font:var(--hei);
  font-family:var(--page-font);
  background-color:#fff;border-radius:26px;border:1px solid rgba(0,0,0,.07);
  padding:34px 24px 24px;display:flex;flex-direction:column;position:relative;
  box-shadow:0 1px 1px rgba(40,32,20,.04),0 32px 64px -36px rgba(40,32,20,.42);
  animation:fadeUp .45s cubic-bezier(.2,.8,.2,1) both;color:var(--ink);
}
.card>*{position:relative;z-index:1}
.bg-veil{
  position:absolute;inset:0;z-index:0;border-radius:inherit;pointer-events:none;display:none;
  background:rgba(255,255,255,.56);
}
.card.dark .bg-veil{background:rgba(10,9,8,.55)}
.card.has-image{--mute:#6d6760;--ph:#9a9286}
.card.dark.has-image{--mute:rgba(248,245,239,.76);--ph:rgba(248,245,239,.56)}
.card.has-image .bg-veil{display:block}
.card.font-song{--page-font:var(--song)}
.card.font-kai{--page-font:var(--script-cn)}
.card.dark{
  --ink:#f8f5ef;--ink2:rgba(248,245,239,.82);--mute:rgba(248,245,239,.56);--mute2:rgba(248,245,239,.38);
  --line:rgba(255,255,255,.17);--line2:rgba(255,255,255,.11);--fill:rgba(255,255,255,.09);--panel:rgba(255,255,255,.055);
  --ph:rgba(248,245,239,.42);--dash:rgba(255,255,255,.26);--hover:rgba(255,255,255,.07);
  border-color:rgba(255,255,255,.13);
}

/* ---------- header ---------- */
.logo{
  font-family:var(--script);font-size:38px;line-height:1.3;text-align:center;color:var(--ink);
  min-height:46px;padding:0 4px;transition:background .18s;border-radius:8px;
}
.logo.is-empty::before{content:attr(data-ph)}
.avatar-wrap{display:flex;justify-content:center;margin:14px 0 18px}
.avatar{
  width:92px;height:92px;border-radius:50%;background:var(--fill);border:1px solid var(--line);
  position:relative;overflow:hidden;cursor:pointer;display:grid;place-items:center;
  transition:border-color .2s,background .2s;
}
.avatar:hover{border-color:#d5cbb8}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.empty{border-style:dashed;background:transparent}
.avatar-add{font-size:10.5px;color:var(--mute);text-align:center;line-height:1.5;letter-spacing:.06em;pointer-events:none}
.avatar-add b{display:block;font-size:19px;font-weight:300;color:var(--mute2);line-height:1.1}
.avatar-del{
  position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;border:0;
  background:rgba(20,18,15,.55);color:#fff;font-size:10px;line-height:1;cursor:pointer;
  display:none;place-items:center;
}
.avatar:hover .avatar-del{display:grid}

.name{
  font-family:var(--page-font);font-size:30px;font-weight:600;line-height:1.34;text-align:center;
  letter-spacing:.01em;margin:0;padding:0 4px;border-radius:8px;color:var(--ink);
}
.sub{
  margin-top:9px;font-size:12.5px;color:var(--mute);text-align:center;letter-spacing:.04em;
  line-height:1.6;padding:0 8px;border-radius:8px;
}
.bio{
  margin-top:9px;font-size:13px;line-height:1.8;color:var(--ink2);text-align:center;
  padding:0 10px;border-radius:8px;
}
.hfield{transition:background .18s}
#editor:not(.clean) .hfield:hover{background:var(--hover)}
.hfield:focus{background:var(--hover)}
.hfield.is-empty::before{content:attr(data-ph);color:var(--ph);pointer-events:none}

/* ---------- blocks ---------- */
.blocks{margin-top:26px;padding-bottom:24px}
.blocks:empty::after{
  content:'还没有板块';display:block;text-align:center;
  font-size:11.5px;color:var(--ph);letter-spacing:.04em;padding:4px 0;line-height:1.6;
}
.block{position:relative;margin-top:24px;padding:2px 0;border-radius:12px}
.block:first-child{margin-top:0}
.block.sel{outline:1px dashed var(--dash);outline-offset:7px}

/* toolbar */
.tb{
  position:absolute;top:-28px;right:2px;z-index:30;display:flex;align-items:center;gap:1px;
  padding:2px;background:#fff;border:1px solid #e7e0d3;border-radius:11px;
  box-shadow:0 10px 24px -12px rgba(50,40,25,.45),0 1px 2px rgba(50,40,25,.06);
  opacity:0;transform:translateY(4px) scale(.97);pointer-events:none;
  transition:opacity .16s,transform .16s;
}
.block:hover .tb,.block.sel .tb{opacity:1;transform:none;pointer-events:auto}
.tb-btn{
  width:24px;height:24px;border:0;background:transparent;border-radius:7px;color:#6b655b;
  display:grid;place-items:center;cursor:pointer;font-size:11px;font-weight:600;
  transition:background .14s,color .14s;padding:0;
}
.tb-btn svg{width:15px;height:15px;display:block}
.tb-btn:hover{background:#f5f1e8;color:var(--ink)}
.tb-btn.on,.tb-btn.on:hover{background:#191817;color:#fff}
.tb-btn.danger:hover{background:#fbeae6;color:#c1462c}
.tb-sep{width:1px;height:15px;background:#efe8db;margin:0 3px}

/* text block */
.tx-title{font-size:16px;font-weight:600;line-height:1.5;letter-spacing:.01em}
.tx-body{font-size:14px;font-weight:400;line-height:1.78;color:var(--ink2);margin-top:5px}
.tx-title.is-empty::before,.tx-body.is-empty::before{content:attr(data-ph);color:var(--ph);pointer-events:none}
.prewrap{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}

/* button block */
.blk-btn{
  display:flex;align-items:center;gap:14px;padding:11px 13px;border-radius:16px;
  border:1px solid var(--line2);background:var(--panel);transition:background .18s,border-color .18s,box-shadow .18s;
}
.blk-btn:hover{background:var(--hover);border-color:var(--line);box-shadow:0 8px 18px -14px rgba(50,40,25,.6)}
.blk-btn-icon{
  width:46px;height:46px;flex:0 0 46px;border-radius:13px;background:var(--fill);
  display:grid;place-items:center;font-size:21px;overflow:hidden;position:relative;cursor:pointer;
  transition:background .18s;
}
.blk-btn-icon:hover{background:var(--hover)}
.blk-btn-icon img{width:100%;height:100%;object-fit:cover;display:block}
.blk-btn-main{min-width:0;flex:1;text-align:left}
.bt-title{font-size:14.5px;font-weight:600;line-height:1.45;color:var(--ink)}
.bt-body{font-size:12.5px;line-height:1.45;color:var(--mute);margin-top:2px}
.bt-title.is-empty::before,.bt-body.is-empty::before{content:attr(data-ph);color:var(--ph);pointer-events:none}
.one-line{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* image block */
.img-grid{display:grid;gap:6px}
.img-grid[data-layout="one"]{grid-template-columns:1fr;gap:10px}
.img-grid[data-layout="three"]{grid-template-columns:repeat(3,1fr);gap:4px}
.img-grid[data-layout="four"]{grid-template-columns:repeat(4,1fr);gap:10px}
.tile{position:relative;overflow:hidden;border-radius:12px;background:var(--fill)}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.img-grid[data-layout="one"] .tile img{height:auto}
.img-grid[data-layout="three"] .tile,.img-grid[data-layout="four"] .tile{aspect-ratio:1/1;border-radius:9px}
.tile-del{
  position:absolute;bottom:5px;right:5px;width:21px;height:21px;border-radius:50%;border:0;
  background:rgba(20,18,15,.62);color:#fff;font-size:10px;line-height:1;cursor:pointer;
  display:grid;place-items:center;opacity:0;transition:opacity .15s,background .15s;
}
.tile:hover .tile-del{opacity:1}
.tile-del:hover{background:rgba(190,60,30,.9)}
.tile-add{
  border:1px dashed var(--dash);background:var(--panel);color:var(--mute);display:grid;place-items:center;
  font-size:20px;cursor:pointer;min-height:84px;transition:background .16s,color .16s,border-color .16s;
  border-radius:12px;font-family:inherit;
}
.tile-add:hover{background:var(--hover);color:var(--ink2);border-color:var(--mute)}
.img-grid[data-layout="three"] .tile-add,.img-grid[data-layout="four"] .tile-add{min-height:0;aspect-ratio:1/1;font-size:15px;border-radius:9px}

/* spacer */
.is-spacer{padding:0}
.spacer{display:flex;align-items:center;justify-content:center;position:relative}
.spacer::before{content:'';position:absolute;left:0;right:0;top:50%;border-top:1px dashed var(--line)}
.spacer-tag{
  position:relative;font-size:10.5px;color:var(--mute);letter-spacing:.1em;background:var(--panel);
  padding:0 8px;opacity:0;transition:opacity .16s;
}
.block:hover .spacer-tag{opacity:1}

/* add block */
.add-block{
  margin-top:auto;height:46px;border-radius:14px;border:1px dashed var(--dash);background:transparent;
  color:var(--mute);font-size:13px;letter-spacing:.06em;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:7px;
  transition:background .18s,color .18s,border-color .18s;flex:0 0 auto;
}
.add-block:hover{background:var(--hover);color:var(--ink2);border-color:var(--mute)}
.add-block svg{width:14px;height:14px}

/* ---------- bottom bar ---------- */
.bottombar{
  position:fixed;left:0;right:0;bottom:0;z-index:70;
  padding:12px 14px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--paper) 46%,rgba(244,241,234,.82) 76%,rgba(244,241,234,0));
  pointer-events:none;
}
.bar-inner{width:min(420px,100%);margin:0 auto;display:flex;gap:10px;pointer-events:auto}
.bar-inner .btn{height:47px}
#btnReset{flex:1}
#btnSave{flex:1.55}

/* ---------- sheet ---------- */
.mask{
  position:fixed;inset:0;z-index:90;background:rgba(28,24,18,.34);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .22s;
}
.mask.on{opacity:1;pointer-events:auto}
.sheet{
  width:min(440px,100%);background:#fff;border-radius:22px 22px 0 0;
  max-height:88dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:18px 16px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(26px);transition:transform .3s cubic-bezier(.2,.85,.25,1);
  box-shadow:0 -20px 50px -20px rgba(30,24,16,.35);
}
.mask.on .sheet{transform:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px}
.sheet-title{font-size:14.5px;font-weight:600;letter-spacing:.02em}
.sheet-x{
  border:0;background:#f5f1e9;width:26px;height:26px;border-radius:50%;color:#8d8578;
  cursor:pointer;display:grid;place-items:center;font-size:13px;line-height:1;
}
.sheet-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.sheet-item{
  border:1px solid var(--line);background:#fdfcf9;border-radius:16px;padding:13px 12px 12px;
  text-align:left;cursor:pointer;transition:border-color .16s,background .16s,transform .16s;font-family:inherit;
}
.sheet-item:hover{border-color:#d2c8b6;background:#faf6ee;transform:translateY(-1px)}
.sheet-item:active{transform:scale(.99)}
.si-ic{
  width:32px;height:32px;border-radius:10px;background:#f2ede3;color:#463f34;
  display:grid;place-items:center;margin-bottom:9px;font-size:15px;
}
.si-ic svg{width:16px;height:16px}
.si-t{font-size:13.5px;font-weight:600;color:var(--ink);letter-spacing:.01em}
.si-d{font-size:11px;color:var(--mute);margin-top:3px;line-height:1.5}
.sheet-foot{margin-top:12px;text-align:center;font-size:11px;color:#bdb5a7;letter-spacing:.04em}

/* ---------- popover ---------- */
.pop{
  position:fixed;z-index:120;width:238px;background:#fff;border:1px solid #e7e0d3;border-radius:15px;
  box-shadow:0 24px 46px -22px rgba(50,40,25,.5);padding:12px;
  animation:popIn .16s ease both;
}
.pop-label{font-size:10.5px;color:var(--mute);letter-spacing:.08em;margin-bottom:6px}
.pop-row{display:flex;gap:6px}
.pop-input{
  flex:1;min-width:0;height:34px;border-radius:9px;border:1px solid var(--line);background:#fbf9f5;
  padding:0 10px;font-size:14px;outline:none;color:var(--ink);font-family:inherit;
}
.pop-input:focus{border-color:#cfc5b2;background:#fff}
.pop-ok{
  height:34px;padding:0 12px;border-radius:9px;border:0;background:var(--ink);color:#fff;
  font-size:12px;cursor:pointer;
}
.pop-emojis{display:flex;flex-wrap:wrap;gap:2px;margin:9px 0 2px}
.pop-emojis button{
  width:28px;height:28px;border:0;background:transparent;border-radius:8px;cursor:pointer;
  font-size:15px;line-height:1;transition:background .14s;
}
.pop-emojis button:hover{background:#f4efe5}
.pop-sep{height:1px;background:#f0eade;margin:9px -2px}
.pop-action{
  width:100%;height:32px;border:0;background:transparent;border-radius:8px;text-align:left;
  padding:0 8px;font-size:12.5px;color:var(--ink2);cursor:pointer;display:flex;align-items:center;gap:7px;
}
.pop-action:hover{background:#f6f2e9}
.pop-action svg{width:13px;height:13px;color:#8d8578}

/* ---------- background panel ---------- */
.bg-presets{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 8px}
.bg-tile{
  border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;
  font-family:inherit;min-width:0;
}
.bg-thumb{
  width:100%;aspect-ratio:1/1;border-radius:14px;display:block;position:relative;
  border:1px solid rgba(20,18,15,.1);transition:box-shadow .16s,transform .16s;background-size:16px 16px;
}
.bg-tile:hover .bg-thumb{transform:translateY(-1px)}
.bg-tile.on .bg-thumb{box-shadow:0 0 0 2px #191817,0 0 0 4.5px #fff inset}
.bg-name{font-size:9.5px;color:var(--mute);letter-spacing:.02em;white-space:nowrap;transform:scale(.96)}
.bg-tile.on .bg-name{color:var(--ink)}

.panel-label{font-size:10.5px;letter-spacing:.14em;color:#a8a7a3;margin:20px 0 10px}
.sheet-head + .panel-label{margin-top:16px}
.bg-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;
}
#bgDotWrap{transition:opacity .2s}
#bgDotWrap.off{opacity:.4;pointer-events:none}
.font-chips{display:flex;gap:8px}
.font-chip{
  flex:1;height:47px;border-radius:12px;border:1px solid var(--line);background:#fcfcfb;
  cursor:pointer;font-size:14px;color:var(--ink2);display:grid;place-items:center;line-height:1.15;
  transition:border-color .16s,background .16s,color .16s;
}
.font-chip small{display:block;font-size:9px;letter-spacing:.08em;opacity:.5;margin-top:3px;font-family:var(--hei)}
.font-chip:hover{border-color:#cfcecb;background:#f7f7f5}
.font-chip.on{border-color:#171716;background:#171716;color:#fff}
.font-chip.on small{opacity:.62}
.bg-color{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink2);cursor:pointer}
.bg-color-sw{
  width:28px;height:28px;border-radius:9px;border:1px solid rgba(20,18,15,.14);display:block;
  position:relative;overflow:hidden;flex:0 0 28px;box-shadow:0 1px 2px rgba(0,0,0,.05) inset;
}
.bg-color-sw input{position:absolute;inset:-10px;width:48px;height:48px;border:0;padding:0;background:none;cursor:pointer;opacity:0}
.bg-dots{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);cursor:pointer}
.sw{width:38px;height:22px;border-radius:20px;background:#e6dfd1;position:relative;display:inline-block;transition:background .2s;flex:0 0 auto}
.sw input{position:absolute;inset:0;margin:0;opacity:0;cursor:pointer;z-index:2}
.sw i{position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:2px;left:2px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw.on{background:#191817}
.sw.on i{transform:translateX(16px)}

.bg-img-row{display:flex;gap:8px;margin-top:16px}
.bg-img-row button{
  height:40px;border-radius:11px;font-size:12.5px;cursor:pointer;font-family:inherit;
  transition:background .16s,border-color .16s,color .16s;
}
#bgUpload{flex:1;border:1px solid var(--line);background:#fdfcf9;color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:7px}
#bgUpload:hover{background:#f7f2e8;border-color:#ddd4c3}
#bgUpload svg{width:14px;height:14px}
#bgClear{border:1px solid var(--line);background:#fff;color:var(--mute);padding:0 14px}
#bgClear:hover{color:#c1462c;border-color:#efd6cf;background:#fdf5f3}
#bgClear:disabled{opacity:.4;cursor:default}
.bg-hint{margin-top:11px;font-size:10.5px;color:#bdb5a7;letter-spacing:.03em;line-height:1.6}

.bg-op-head{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--ink2)}
.bg-op-head b{font-size:11.5px;color:var(--ink);font-weight:600}

/* ---------- opacity popover ---------- */
.pop-range{
  width:100%;height:4px;border-radius:4px;background:#eee7da;outline:none;margin:8px 0 12px;
  -webkit-appearance:none;appearance:none;display:block;
}
.pop-range::-webkit-slider-thumb{
  -webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#191817;
  border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.35);cursor:pointer;
}
.pop-range::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#191817;border:2px solid #fff;cursor:pointer}
.pop-val{float:right;color:var(--ink);font-weight:600}
.pop-presets{display:flex;gap:5px}
.pop-presets button{
  flex:1;height:26px;border-radius:7px;border:1px solid var(--line);background:#fbf9f5;
  font-size:11px;color:var(--ink2);cursor:pointer;font-family:inherit;transition:background .14s;
}
.pop-presets button:hover{background:#f2ece1;border-color:#ddd4c3}

/* ---------- toast & dialog ---------- */
.toast{
  position:fixed;left:50%;bottom:92px;transform:translate(-50%,10px);
  background:rgba(24,22,18,.92);color:#fff;font-size:12.5px;padding:9px 16px;border-radius:20px;
  opacity:0;pointer-events:none;transition:opacity .24s,transform .24s;z-index:200;letter-spacing:.02em;
  max-width:86vw;text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.dialog-mask{align-items:center;padding:24px}
.dialog{
  width:min(320px,100%);background:#fff;border-radius:20px;padding:22px 20px 16px;text-align:center;
  transform:scale(.96);transition:transform .22s;box-shadow:0 30px 60px -24px rgba(30,24,16,.5);
}
.mask.on .dialog{transform:none}
.dialog h3{margin:0 0 8px;font-size:15.5px;font-weight:600;letter-spacing:.01em}
.dialog p{margin:0 0 18px;font-size:12.5px;color:var(--mute);line-height:1.6}
.dialog-btns{display:flex;gap:9px}
.dialog-btns .btn{flex:1;height:43px;font-size:13.5px}

/* ---------- clean (preview / export) ---------- */
.clean .edit-only{display:none!important}
.clean .is-empty::before{display:none!important}
.clean .block.sel{outline:none}
.clean [contenteditable]{pointer-events:none}
.clean .blk-btn:hover{background:var(--panel);border-color:var(--line2);box-shadow:none}
.clean .spacer::before{border-top-color:transparent}
.clean .blocks:empty::after{display:none}
.clean .avatar-wrap.is-empty{display:none}
.clean .avatar-wrap.is-empty + .name{margin-top:20px}

/* ---------- motion ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:translateY(4px) scale(.97)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}

@media (max-width:400px){
  .card{padding:28px 18px 18px;border-radius:22px}
  .name{font-size:26px}
  .logo{font-size:33px}
  .w-brand{font-size:52px}
  .canvas{padding:56px 10px 108px}
}
@media (min-width:560px){
  .sheet{border-radius:22px;margin-bottom:26px}
  .mask{align-items:center;padding-bottom:0}
}
</style>
</head>
<body>

<!-- ==================== 欢迎页 ==================== -->
<section id="welcome">
  <div class="w-brand">litpage</div>
  <p class="w-tag">one page about you</p>

  <div class="w-card">
    <h1>做一页属于你的自我介绍</h1>
    <p class="w-sub">先告诉我你的名字，剩下的慢慢填。</p>
    <label class="w-label" for="nameInput">你的名字</label>
    <input id="nameInput" class="w-input" type="text" maxlength="24" placeholder="例如：林小满" autocomplete="off">
    <button id="startBtn" class="btn dark w-btn">开始制作</button>
    <button id="resumeBtn" class="w-resume hidden" style="display:none">继续上次的编辑 · <b id="draftName"></b></button>
  </div>

  <p class="w-foot">填过的内容自动保存在这台设备上 · 一键保存为图片</p>
</section>

<!-- ==================== 编辑页 ==================== -->
<section id="editor">
  <div class="chrome">
    <div class="brand">litpage</div>
    <div class="chrome-right">
    <button class="pv-btn" id="bgBtn">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="8" cy="8" r="5.6"/><path d="M8 2.4v11.2" stroke-linecap="round"/><path d="M8 8h5.6a5.6 5.6 0 0 1-5.6 5.6z" fill="currentColor" stroke="none"/></svg>
      <span>UI修改</span>
    </button>
    <button class="pv-btn" id="pvBtn">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1.5 8S3.9 3.5 8 3.5 14.5 8 14.5 8S12.1 12.5 8 12.5 1.5 8 1.5 8Z"/><circle cx="8" cy="8" r="1.9"/></svg>
      <span>预览</span>
    </button>
    </div>
  </div>

  <div class="canvas">
    <div class="card" id="card">
      <div class="bg-veil" id="bgVeil"></div>
      <div class="logo hfield" id="logoEl" contenteditable="true" spellcheck="false" data-ph="logo"></div>

      <div class="avatar-wrap">
        <div class="avatar empty" id="avatar">
          <div class="avatar-add edit-only"><b>＋</b>上传头像</div>
          <button class="avatar-del edit-only" id="avatarDel" title="移除头像">✕</button>
        </div>
      </div>

      <h1 class="name hfield" id="nameEl" contenteditable="true" spellcheck="false" data-ph="名字"></h1>
      <div class="sub hfield" id="subEl" contenteditable="true" spellcheck="false" data-ph="小标题"></div>
      <div class="bio hfield" id="bioEl" contenteditable="true" spellcheck="false" data-ph="简介"></div>

      <div class="blocks" id="blocks"></div>

      <button class="add-block edit-only" id="addBlock">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
        添加板块
      </button>
    </div>
  </div>

  <div class="bottombar">
    <div class="bar-inner">
      <button class="btn ghost" id="btnReset">重置</button>
      <button class="btn dark" id="btnSave">保存为图片</button>
    </div>
  </div>
</section>

<!-- ==================== 添加板块面板 ==================== -->
<div class="mask" id="sheetMask">
  <div class="sheet">
    <div class="sheet-head">
      <div class="sheet-title">添加板块</div>
      <button class="sheet-x" id="sheetClose">✕</button>
    </div>
    <div class="sheet-grid" id="sheetGrid">
      <button class="sheet-item" data-block="button">
        <div class="si-ic">✦</div>
        <div class="si-t">按钮</div>
        <div class="si-d">左边图标，右边标题与正文</div>
      </button>
      <button class="sheet-item" data-block="text">
        <div class="si-ic" style="font-family:var(--hei);font-size:14px;font-weight:600">Aa</div>
        <div class="si-t">文字</div>
        <div class="si-d">标题 + 正文，回车换行</div>
      </button>
      <button class="sheet-item" data-block="image">
        <div class="si-ic"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="2.2" y="3.2" width="11.6" height="9.6" rx="2"/><circle cx="6" cy="6.8" r="1.1"/><path d="M3.4 11.6 6.9 8.6l2 1.7 1.8-1.5 1.9 2.6"/></svg></div>
        <div class="si-t">图片</div>
        <div class="si-d">大图 / 三列 / 四列</div>
      </button>
      <button class="sheet-item" data-block="spacer">
        <div class="si-ic"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M8 2v12M5.2 4.6 8 2l2.8 2.6M5.2 11.4 8 14l2.8-2.6"/></svg></div>
        <div class="si-t">空格</div>
        <div class="si-d">小 / 中 / 大 三种高度</div>
      </button>
    </div>
    <div class="sheet-foot">板块加好后，点它就能修改样式</div>
  </div>
</div>

<!-- ==================== 背景面板 ==================== -->
<div class="mask" id="bgMask">
  <div class="sheet">
    <div class="sheet-head">
      <div class="sheet-title">UI 修改</div>
      <button class="sheet-x" id="bgClose">✕</button>
    </div>

    <div class="panel-label">背景</div>
    <div class="bg-presets" id="bgPresets">
      <button class="bg-tile" data-color="#ffffff" data-dot="#dcdcd8" data-dots="1">
        <span class="bg-thumb" style="background-color:#ffffff;background-image:radial-gradient(#dcdcd8 1.2px, transparent 1.4px);background-size:8px 8px"></span>
        <span class="bg-name">白 · 波点</span>
      </button>
      <button class="bg-tile" data-color="#fbeceb" data-dot="#f0c9c6" data-dots="1">
        <span class="bg-thumb" style="background-color:#fbeceb;background-image:radial-gradient(#f0c9c6 1.2px, transparent 1.4px);background-size:8px 8px"></span>
        <span class="bg-name">浅粉波点</span>
      </button>
      <button class="bg-tile" data-color="#eaf1f8" data-dot="#c8dcee" data-dots="1">
        <span class="bg-thumb" style="background-color:#eaf1f8;background-image:radial-gradient(#c8dcee 1.2px, transparent 1.4px);background-size:8px 8px"></span>
        <span class="bg-name">浅蓝波点</span>
      </button>
      <button class="bg-tile" data-color="#141414" data-dot="#3d3d3a" data-dots="1">
        <span class="bg-thumb" style="background-color:#141414;background-image:radial-gradient(#3d3d3a 1.2px, transparent 1.4px);background-size:8px 8px"></span>
        <span class="bg-name">黑 · 波点</span>
      </button>
      <button class="bg-tile" data-color="#fbeceb" data-dot="#f0c9c6" data-dots="0">
        <span class="bg-thumb" style="background-color:#fbeceb"></span>
        <span class="bg-name">浅粉</span>

      <button class="bg-tile" data-color="#eaf1f8" data-dot="#c8dcee" data-dots="0">

  </div>
</div>

<div class="toast" id="toast"></div>

<script src="./assets/html-to-image.js"></script>
<script>
/* =========================================================
   litpage — 一页式自我介绍生成器
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const uid = () => 'b' + Math.random().toString(36).slice(2, 8);
const el = (tag, cls, txt) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt != null) n.textContent = txt;
  return n;
};
const sleep = ms => new Promise(r => setTimeout(r, ms));

const ICON = {
  up: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12.2V4M4.6 7.4 8 4l3.4 3.4"/></svg>',
  down: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3.8V12M4.6 8.6 8 12l3.4-3.4"/></svg>',
  del: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4.6 4.6l6.8 6.8M11.4 4.6l-6.8 6.8"/></svg>',
  'align-left': '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 4h10M3 8h6M3 12h9"/></svg>',
  'align-center': '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 4h10M5 8h6M3.5 12h9"/></svg>',
  'align-right': '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 4h10M7 8h6M4 12h9"/></svg>',
  'layout-1': '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="3" y="4.4" width="10" height="7.2" rx="1.6"/></svg>',
  'layout-3': '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="2.4" y="4.6" width="3" height="6.8" rx="1"/><rect x="6.5" y="4.6" width="3" height="6.8" rx="1"/><rect x="10.6" y="4.6" width="3" height="6.8" rx="1"/></svg>',
  'layout-4': '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.1"><rect x="2.3" y="5" width="2.4" height="6" rx=".9"/><rect x="5.8" y="5" width="2.4" height="6" rx=".9"/><rect x="9.3" y="5" width="2.4" height="6" rx=".9"/><rect x="12.8" y="5" width="2.4" height="6" rx=".9"/></svg>',
  image: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="3.2" width="12" height="9.6" rx="2"/><circle cx="5.8" cy="6.6" r="1"/><path d="M3.2 11.4 6.6 8.5l2 1.7 1.7-1.4 2 2.6"/></svg>',
  text: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 4.5h10M3 8h7M3 11.5h9"/></svg>',
  opacity: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="8" cy="8" r="5.4"/><path d="M8 2.6a5.4 5.4 0 0 1 0 10.8z" fill="currentColor" stroke="none"/></svg>'
};

/* ---------------- state ---------------- */
const KEY = 'litpage.v1';
let S = null;
let draft = null;
let saveTimer = null;

const blocksEl = $('#blocks');
const editorEl = $('#editor');
const cardEl = $('#card');

function blankState(name) {
  return {
    name: name || '', logo: '', avatar: '', subtitle: '', bio: '',
    blocks: [], selectedId: null, font: 'hei',
    bg: { color: '#ffffff', dots: true, dotColor: '#dcdcd8', image: '', dark: false }
  };
}
function queueSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 450);
}
function saveNow() {
  if (!S) return;
  try {
    localStorage.setItem(KEY, JSON.stringify(S));
  } catch (e) {
    if (!saveNow._warned) {
      saveNow._warned = true;
      toast('图片较多，草稿暂时无法自动保存');
    }
  }
}
function readDraft() {
  try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { return null; }
}

/* ---------------- background ---------------- */
const DEFAULT_BG = { color: '#ffffff', dots: true, dotColor: '#dcdcd8', image: '', dark: false };
const AUTO_DOT = { light: '#dcdcd8', dark: '#3d3d3a' };

function bgState() {
  if (!S.bg) S.bg = Object.assign({}, DEFAULT_BG);
  return S.bg;
}
function hexLum(hex) {
  const h = String(hex || '#ffffff').replace('#', '');
  if (h.length < 6) return 1;
  const r = parseInt(h.slice(0, 2), 16) / 255;
  const g = parseInt(h.slice(2, 4), 16) / 255;
  const b = parseInt(h.slice(4, 6), 16) / 255;
  if ([r, g, b].some(isNaN)) return 1;
  return 0.299 * r + 0.587 * g + 0.114 * b;
}
function imageIsDark(src) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      try {
        const c = document.createElement('canvas');
        c.width = 24; c.height = 24;
        const x = c.getContext('2d');
        x.drawImage(img, 0, 0, 24, 24);
        const d = x.getImageData(0, 0, 24, 24).data;
        let sum = 0, n = 0;
        for (let i = 0; i < d.length; i += 4) {
          if (d[i + 3] < 40) continue;
          sum += (0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]) / 255;
          n++;
        }
        resolve(n ? (sum / n) < 0.56 : false);
      } catch (e) { resolve(false); }
    };
    img.onerror = () => resolve(false);
    img.src = src;
  });
}
function applyFont() {
  const f = (S && S.font) || 'hei';
  cardEl.classList.toggle('font-song', f === 'song');
  cardEl.classList.toggle('font-kai', f === 'kai');
  $$('#fontChips .font-chip').forEach(c => c.classList.toggle('on', c.dataset.font === f));
}

function applyBg() {
  const bg = bgState();
  cardEl.classList.toggle('dark', !!bg.dark);
  cardEl.classList.toggle('has-image', !!bg.image);
  if (bg.image) {
    cardEl.style.backgroundColor = '#ffffff';
    cardEl.style.backgroundImage = 'url("' + bg.image + '")';
    cardEl.style.backgroundSize = 'cover';
    cardEl.style.backgroundPosition = 'center';
    cardEl.style.backgroundRepeat = 'no-repeat';
  } else {
    cardEl.style.backgroundColor = bg.color;
    if (bg.dots) {
      const dot = bg.dotColor || (bg.dark ? AUTO_DOT.dark : AUTO_DOT.light);
      cardEl.style.backgroundImage = 'radial-gradient(' + dot + ' 1.1px, transparent 1.2px)';
      cardEl.style.backgroundSize = '18px 18px';
      cardEl.style.backgroundPosition = '0 0';
      cardEl.style.backgroundRepeat = 'repeat';
    } else {
      cardEl.style.backgroundImage = 'none';
    }
  }
  syncBgUI();
}
function syncBgUI() {
  const bg = bgState();
  $$('#bgPresets .bg-tile').forEach(t => {
    const on = !bg.image
      && t.dataset.color.toLowerCase() === String(bg.color).toLowerCase()
      && (t.dataset.dots === '1') === !!bg.dots;
    t.classList.toggle('on', on);
  });
  const dot = bg.dotColor || (bg.dark ? AUTO_DOT.dark : AUTO_DOT.light);
  $('#bgColor').value = /^#[0-9a-f]{6}$/i.test(bg.color) ? bg.color : '#ffffff';
  $('#bgColorSw').style.background = bg.color;
  $('#bgDot').value = /^#[0-9a-f]{6}$/i.test(dot) ? dot : '#dcdcd8';
  $('#bgDotSw').style.background = dot;
  $('#bgDotWrap').classList.toggle('off', !bg.dots || !!bg.image);
  $('#bgDots').checked = !!bg.dots;
  $('#bgDotsSwitch').classList.toggle('on', !!bg.dots);
  $('#bgClear').disabled = !bg.image;
  const others = (S.blocks || []).filter(b => b.type !== 'image');
  const vals = others.map(b => (b.opacity == null ? 100 : b.opacity));
  const same = vals.length ? vals.every(v => v === vals[0]) : true;
  $('#bgOpacity').value = same && vals.length ? vals[0] : 100;
  $('#bgOpVal').textContent = vals.length && !same ? '多个值' : (same ? (vals[0] || 100) : 100) + '%';
  $('#bgHint').textContent = '只作用于按钮、文字与空格，不影响图片板块。';
}

/* ---------------- toast ---------------- */
let toastTimer = null;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 2000);
}

/* ---------------- contenteditable ---------------- */
function syncEmpty(node) {
  node.classList.toggle('is-empty', node.textContent.trim() === '');
}
function setField(node, val) {
  if (document.activeElement === node) return;
  node.textContent = val || '';
  syncEmpty(node);
}
function bindEditable(node, onChange, single) {
  node.addEventListener('input', () => {
    syncEmpty(node);
    const v = node.innerText.replace(/\u00a0/g, ' ').replace(/\n+$/, '');
    onChange(v);
  });
  node.addEventListener('keydown', e => {
    if (single && e.key === 'Enter') { e.preventDefault(); node.blur(); }
    if (e.key === 'Escape') node.blur();
  });
  node.addEventListener('paste', e => {
    e.preventDefault();
    let t = (e.clipboardData || window.clipboardData).getData('text/plain') || '';
    if (single) t = t.replace(/[\r\n]+/g, ' ');
    document.execCommand('insertText', false, t);
  });
  node.addEventListener('blur', () => { syncEmpty(node); queueSave(); });
}

/* ---------------- image helpers ---------------- */
function shrink(file, max) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const ratio = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * ratio));
      const h = Math.max(1, Math.round(img.height * ratio));
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = err => { URL.revokeObjectURL(url); reject(err); };
    img.src = url;
  });
}
function pickImages(multiple, max) {
  return new Promise(resolve => {
    const inp = el('input');
    inp.type = 'file';
    inp.accept = 'image/*';
    inp.multiple = !!multiple;
    inp.style.display = 'none';
    document.body.appendChild(inp);
    inp.addEventListener('change', async () => {
      const files = Array.from(inp.files || []).slice(0, multiple ? 24 : 1);
      inp.remove();
      const out = [];
      for (const f of files) {
        try { out.push(await shrink(f, max)); } catch (e) { /* skip */ }
      }
      resolve(out);
    });
    inp.click();
  });
}

/* =========================================================
   welcome
   ========================================================= */
const nameInput = $('#nameInput');
const resumeBtn = $('#resumeBtn');

function normalizeDraft(d) {
  const base = blankState(d.name || '');
  const out = Object.assign(base, d);
  out.blocks = Array.isArray(d.blocks) ? d.blocks : [];
  out.selectedId = null;
  if (!out.bg) out.bg = { color: '#ffffff', dots: true, dotColor: '#dcdcd8', image: '', dark: false };
  if (!out.bg.dotColor) out.bg.dotColor = out.bg.dark ? '#3d3d3a' : '#dcdcd8';
  if (!out.font) out.font = 'hei';
  return out;
}

function showEditorScreen() {
  $('#welcome').style.display = 'none';
  editorEl.classList.add('on');
  document.body.style.overflowX = 'hidden';
  window.scrollTo(0, 0);
  renderAll();
}

function initWelcome() {
  draft = readDraft();
  if (draft && (draft.name || (draft.blocks && draft.blocks.length))) {
    nameInput.value = draft.name || '';
    $('#draftName').textContent = draft.name || '未命名';
    resumeBtn.style.display = 'block';
  }
}

function enterEditor(resume) {
  const typed = nameInput.value.trim();
  if (!resume && !typed) {
    nameInput.classList.remove('shake');
    void nameInput.offsetWidth;
    nameInput.classList.add('shake');
    nameInput.focus();
    return;
  }
  if (resume && draft) {
    S = normalizeDraft(draft);
  } else if (draft && draft.name === typed && (draft.blocks.length || draft.bio || draft.avatar)) {
    S = normalizeDraft(draft);
  } else {
    S = blankState(typed);
  }
  showEditorScreen();
  saveNow();
}

$('#startBtn').addEventListener('click', () => enterEditor(false));
resumeBtn.addEventListener('click', () => enterEditor(true));
nameInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); enterEditor(false); }
});

/* =========================================================
   render header
   ========================================================= */
function renderAll() {
  setField($('#logoEl'), S.logo);
  setField($('#nameEl'), S.name);
  setField($('#subEl'), S.subtitle);
  setField($('#bioEl'), S.bio);
  renderAvatar();
  renderBlocks();
  applyBg();
  applyFont();
}

function renderAvatar() {
  const box = $('#avatar');
  const old = box.querySelector('img');
  if (old) old.remove();
  box.parentElement.classList.toggle('is-empty', !S.avatar);
  if (S.avatar) {
    const img = new Image();
    img.src = S.avatar;
    img.alt = '头像';
    box.insertBefore(img, box.firstChild);
    box.classList.remove('empty');
  } else {
    box.classList.add('empty');
  }
}

/* =========================================================
   blocks
   ========================================================= */
const SPACER = { s: 14, m: 34, lg: 64 };
const SPACER_LABEL = { s: '小', m: '中', lg: '大' };

function makeBlock(type) {
  if (type === 'button') return { id: uid(), type, icon: { char: '✦', img: null }, title: '', body: '' };
  if (type === 'text') return { id: uid(), type, align: 'left', title: '', text: '' };
  if (type === 'image') return { id: uid(), type, layout: 'one', images: [] };
  if (type === 'spacer') return { id: uid(), type, size: 'm' };
  return null;
}

function renderBlocks() {
  blocksEl.innerHTML = '';
  S.blocks.forEach(b => blocksEl.appendChild(buildBlock(b)));
}

function selectBlock(id) {
  if (S.selectedId === id) return;
  S.selectedId = id;
  $$('.block.sel', blocksEl).forEach(n => n.classList.remove('sel'));
  const node = blocksEl.querySelector('[data-id="' + id + '"]');
  if (node) node.classList.add('sel');
}

function deselect() {
  if (!S || !S.selectedId) return;
  S.selectedId = null;
  $$('.block.sel', blocksEl).forEach(n => n.classList.remove('sel'));
}

function buildBlock(b) {
  const wrap = el('div', 'block');
  wrap.dataset.id = b.id;
  wrap.dataset.type = b.type;
  if (b.type === 'spacer') wrap.classList.add('is-spacer');
  if (S.selectedId === b.id) wrap.classList.add('sel');
  const content = buildContent(b);
  if (b.type !== 'image' && b.opacity != null) content.style.opacity = b.opacity / 100;
  wrap.appendChild(content);
  wrap.appendChild(buildToolbar(b));
  wrap.addEventListener('click', e => {
    if (e.target.closest('.tb') || e.target.closest('.tile-del')) return;
    selectBlock(b.id);
  });
  return wrap;
}

function buildContent(b) {
  if (b.type === 'text') return buildText(b);
  if (b.type === 'button') return buildButton(b);
  if (b.type === 'image') return buildImage(b);
  return buildSpacer(b);
}

/* ---------- text ---------- */
function buildText(b) {
  const c = el('div', 'block-content text-blk prewrap');
  c.style.textAlign = b.align;
  c.dataset.role = 'text';

  const t = el('div', 'tx-title prewrap');
  t.contentEditable = 'true';
  t.spellcheck = false;
  t.dataset.ph = '小标题';
  t.textContent = b.title || '';
  syncEmpty(t);
  bindEditable(t, v => { b.title = v; queueSave(); });

  const p = el('div', 'tx-body prewrap');
  p.contentEditable = 'true';
  p.spellcheck = false;
  p.dataset.ph = '正文';
  p.textContent = b.text || '';
  syncEmpty(p);
  bindEditable(p, v => { b.text = v; queueSave(); });

  c.appendChild(t);
  c.appendChild(p);
  return c;
}

/* ---------- button ---------- */
function buildButton(b) {
  const c = el('div', 'block-content blk-btn');
  c.dataset.role = 'btn';

  const icon = el('div', 'blk-btn-icon');
  paintIcon(icon, b);
  icon.addEventListener('click', e => {
    e.stopPropagation();
    if (editorEl.classList.contains('clean')) return;
    selectBlock(b.id);
    openIconPopover(b, icon);
  });

  const main = el('div', 'blk-btn-main');

  const t = el('div', 'bt-title one-line');
  t.contentEditable = 'true';
  t.spellcheck = false;
  t.dataset.ph = '标题';
  t.textContent = b.title || '';
  syncEmpty(t);
  bindEditable(t, v => { b.title = v; queueSave(); }, true);

  const p = el('div', 'bt-body one-line');
  p.contentEditable = 'true';
  p.spellcheck = false;
  p.dataset.ph = '正文';
  p.textContent = b.body || '';
  syncEmpty(p);
  bindEditable(p, v => { b.body = v; queueSave(); }, true);

  main.appendChild(t);
  main.appendChild(p);
  c.appendChild(icon);
  c.appendChild(main);
  return c;
}

function paintIcon(node, b) {
  node.innerHTML = '';
  if (b.icon && b.icon.img) {
    const img = new Image();
    img.src = b.icon.img;
    img.alt = '';
    node.appendChild(img);
  } else {
    node.textContent = (b.icon && b.icon.char) || '✦';
  }
}

/* ---------- image ---------- */
function buildImage(b) {
  const grid = el('div', 'block-content img-grid');
  grid.dataset.layout = b.layout;
  grid.dataset.role = 'img';

  b.images.forEach((src, i) => {
    const tile = el('div', 'tile');
    const img = new Image();
    img.src = src;
    img.alt = '';
    tile.appendChild(img);
    const del = el('button', 'tile-del edit-only', '✕');
    del.title = '删除这张图';
    del.addEventListener('click', e => {
      e.stopPropagation();
      b.images.splice(i, 1);
      rebuildBlock(b.id);
    });
    tile.appendChild(del);
    grid.appendChild(tile);
  });

  // 占位格子数量跟随列数：三列补齐到整行 3 个，四列 4 个
  const per = b.layout === 'three' ? 3 : b.layout === 'four' ? 4 : 1;
  const rem = b.images.length % per;
  const slots = per === 1 || (rem === 0 && b.images.length) ? 1 : per - rem;
  for (let k = 0; k < slots; k++) {
    const add = el('button', 'tile tile-add edit-only', '+');
    add.title = per === 1 ? '上传图片' : '上传图片 · 可一次选 ' + per + ' 张';
    add.addEventListener('click', async e => {
      e.stopPropagation();
      const urls = await pickImages(true, 1400);
      if (urls.length) {
        b.images.push(...urls);
        rebuildBlock(b.id);
        queueSave();
      }
    });
    grid.appendChild(add);
  }
  return grid;
}

/* ---------- spacer ---------- */
function buildSpacer(b) {
  const c = el('div', 'block-content spacer');
  c.style.height = (SPACER[b.size] || 34) + 'px';
  c.dataset.role = 'spacer';
  const tag = el('span', 'spacer-tag edit-only', '空格 · ' + (SPACER_LABEL[b.size] || '中'));
  c.appendChild(tag);
  return c;
}

/* ---------- toolbar ---------- */
function buildToolbar(b) {
  const tb = el('div', 'tb edit-only');
  const g = el('div', 'tb-g');
  g.style.display = 'flex';
  g.style.alignItems = 'center';
  g.style.gap = '2px';

  if (b.type === 'text') {
    [['left', '左对齐'], ['center', '居中'], ['right', '右对齐']].forEach(([a, label]) => {
      const btn = el('button', 'tb-btn');
      btn.dataset.act = 'align-' + a;
      btn.title = label;
      btn.innerHTML = ICON['align-' + a];
      if (b.align === a) btn.classList.add('on');
      g.appendChild(btn);
    });
  }
  if (b.type === 'image') {
    [['one', '1', '大图 · 一行一个'], ['three', '3', '一行三个 · 间距紧凑'], ['four', '4', '一行四个 · 间距疏松']].forEach(([val, n, label]) => {
      const btn = el('button', 'tb-btn');
      btn.dataset.act = 'layout-' + val;
      btn.title = label;
      btn.innerHTML = ICON['layout-' + n];
      if (b.layout === val) btn.classList.add('on');
      g.appendChild(btn);
    });
  }
  if (b.type === 'spacer') {
    [['s', '小'], ['m', '中'], ['lg', '大']].forEach(([s, label]) => {
      const btn = el('button', 'tb-btn', label);
      btn.dataset.act = 'size-' + s;
      btn.title = label + '号空格';
      if (b.size === s) btn.classList.add('on');
      g.appendChild(btn);
    });
  }
  if (b.type === 'button') {
    const btn = el('button', 'tb-btn');
    btn.dataset.act = 'icon';
    btn.title = '更换图标';
    btn.innerHTML = ICON.image;
    g.appendChild(btn);
  }
  if (b.type !== 'image') {
    const btn = el('button', 'tb-btn');
    btn.dataset.act = 'opacity';
    btn.title = '透明度';
    btn.innerHTML = ICON.opacity;
    if (b.opacity != null && b.opacity < 100) btn.classList.add('on');
    g.appendChild(btn);
  }

  if (g.children.length) {
    tb.appendChild(g);
    tb.appendChild(el('div', 'tb-sep'));
  }

  const ops = el('div', 'tb-g');
  ops.style.display = 'flex';
  ops.style.alignItems = 'center';
  ops.style.gap = '2px';
  [['up', '上移'], ['down', '下移'], ['del', '删除']].forEach(([a, label]) => {
    const btn = el('button', 'tb-btn' + (a === 'del' ? ' danger' : ''));
    btn.dataset.act = a;
    btn.title = label;
    btn.innerHTML = ICON[a];
    ops.appendChild(btn);
  });
  tb.appendChild(ops);

  tb.addEventListener('click', e => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    e.stopPropagation();
    handleAct(b, btn.dataset.act, tb);
  });
  return tb;
}

function handleAct(b, act, tb) {
  if (act === 'up' || act === 'down') return moveBlock(b.id, act === 'up' ? -1 : 1);
  if (act === 'del') return removeBlock(b.id);
  if (act === 'icon') return openIconPopover(b, tb.parentElement.querySelector('.blk-btn-icon'));
  if (act === 'opacity') return openOpacityPopover(b, tb.querySelector('[data-act="opacity"]'));

  if (act.indexOf('align-') === 0) {
    b.align = act.slice(6);
    const wrap = tb.parentElement;
    const c = wrap.querySelector('.text-blk');
    if (c) c.style.textAlign = b.align;
    $$('[data-act^="align-"]', tb).forEach(n => n.classList.toggle('on', n.dataset.act === act));
    queueSave();
    return;
  }
  if (act.indexOf('layout-') === 0) {
    b.layout = act.slice(7);
    rebuildBlock(b.id);
    return;
  }
  if (act.indexOf('size-') === 0) {
    b.size = act.slice(5);
    const wrap = tb.parentElement;
    const c = wrap.querySelector('.spacer');
    if (c) c.style.height = (SPACER[b.size] || 34) + 'px';
    const tag = wrap.querySelector('.spacer-tag');
    if (tag) tag.textContent = '空格 · ' + SPACER_LABEL[b.size];
    $$('[data-act^="size-"]', tb).forEach(n => n.classList.toggle('on', n.dataset.act === act));
    queueSave();
  }
}

function rebuildBlock(id) {
  const b = S.blocks.find(x => x.id === id);
  const old = blocksEl.querySelector('[data-id="' + id + '"]');
  if (!b || !old) return;
  const fresh = buildBlock(b);
  old.replaceWith(fresh);
  queueSave();
}

function moveBlock(id, dir) {
  const i = S.blocks.findIndex(x => x.id === id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= S.blocks.length) return;
  const tmp = S.blocks[i];
  S.blocks[i] = S.blocks[j];
  S.blocks[j] = tmp;
  S.selectedId = id;
  renderBlocks();
  queueSave();
}

function removeBlock(id) {
  const i = S.blocks.findIndex(x => x.id === id);
  if (i < 0) return;
  S.blocks.splice(i, 1);
  S.selectedId = null;
  renderBlocks();
  queueSave();
}

/* ---------- icon popover ---------- */
let popNode = null;
function closePop() {
  if (popNode) { popNode.remove(); popNode = null; }
}
function openIconPopover(b, anchor) {
  closePop();
  const pop = el('div', 'pop');
  pop.innerHTML = `
    <div class="pop-label">输入一个字符 / emoji</div>
    <div class="pop-row">
      <input class="pop-input" maxlength="4" placeholder="✦" value="">
      <button class="pop-ok">应用</button>
    </div>
    <div class="pop-emojis"></div>
    <div class="pop-sep"></div>
    <button class="pop-action" data-a="upload">${ICON.image}<span>导入图片</span></button>
    <button class="pop-action" data-a="char">${ICON.text}<span>改用字符 / emoji</span></button>
  `;
  document.body.appendChild(pop);
  popNode = pop;

  const input = $('.pop-input', pop);
  input.value = (b.icon && !b.icon.img) ? (b.icon.char || '') : '';

  const emojis = ['✦', '✧', '❋', '♡', '☾', '★', '🍃', '☕', '🎧', '🕊', '🔗', '✎'];
  const row = $('.pop-emojis', pop);
  emojis.forEach(ch => {
    const btn = el('button', '', ch);
    btn.addEventListener('click', () => {
      b.icon = { char: ch, img: null };
      paintIcon(anchor, b);
      queueSave();
      closePop();
    });
    row.appendChild(btn);
  });

  const apply = () => {
    const v = input.value.trim();
    b.icon = { char: v || '✦', img: null };
    paintIcon(anchor, b);
    queueSave();
    closePop();
  };
  $('.pop-ok', pop).addEventListener('click', apply);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); apply(); }
    if (e.key === 'Escape') closePop();
  });

  pop.addEventListener('click', async e => {
    const act = e.target.closest('[data-a]');
    if (!act) return;
    if (act.dataset.a === 'upload') {
      const urls = await pickImages(false, 320);
      if (urls.length) {
        b.icon = { char: b.icon.char, img: urls[0] };
        paintIcon(anchor, b);
        queueSave();
      }
      closePop();
    }
    if (act.dataset.a === 'char') {
      b.icon = { char: input.value.trim() || '✦', img: null };
      paintIcon(anchor, b);
      queueSave();
      closePop();
    }
  });

  placePop(pop, anchor);
  setTimeout(() => input.focus(), 30);
}

function placePop(pop, anchor) {
  const r = anchor.getBoundingClientRect();
  pop.style.visibility = 'hidden';
  const pw = pop.offsetWidth || 238;
  const ph = pop.offsetHeight || 120;
  let left = Math.max(10, Math.min(r.left - 6, window.innerWidth - pw - 10));
  let top = r.bottom + 8;
  if (top + ph > window.innerHeight - 12) top = Math.max(12, r.top - ph - 8);
  pop.style.left = left + 'px';
  pop.style.top = top + 'px';
  pop.style.visibility = 'visible';
}

function openOpacityPopover(b, anchor) {
  closePop();
  const cur = b.opacity == null ? 100 : b.opacity;
  const pop = el('div', 'pop');
  pop.style.width = '216px';
  pop.innerHTML = '<div class="pop-label">板块透明度 <b class="pop-val">' + cur + '%</b></div>'
    + '<input class="pop-range" type="range" min="10" max="100" step="5" value="' + cur + '">'
    + '<div class="pop-presets">'
    + '<button data-v="100">100%</button><button data-v="80">80%</button>'
    + '<button data-v="60">60%</button><button data-v="40">40%</button></div>';
  document.body.appendChild(pop);
  popNode = pop;

  const range = $('.pop-range', pop);
  const val = $('.pop-val', pop);
  const setVal = v => {
    b.opacity = v >= 100 ? null : v;
    val.textContent = v + '%';
    const wrap = blocksEl.querySelector('[data-id="' + b.id + '"]');
    const c = wrap && wrap.querySelector('.block-content');
    if (c) c.style.opacity = (v / 100).toFixed(2);
    const tbBtn = wrap && wrap.querySelector('[data-act="opacity"]');
    if (tbBtn) tbBtn.classList.toggle('on', v < 100);
    queueSave();
  };
  range.addEventListener('input', () => setVal(+range.value));
  pop.addEventListener('click', e => {
    const btn = e.target.closest('[data-v]');
    if (!btn) return;
    range.value = btn.dataset.v;
    setVal(+btn.dataset.v);
  });
  placePop(pop, anchor);
}

/* ---------- add block ---------- */
const sheetMask = $('#sheetMask');
function openSheet() { sheetMask.classList.add('on'); }
function closeSheet() { sheetMask.classList.remove('on'); }

$('#addBlock').addEventListener('click', openSheet);
$('#sheetClose').addEventListener('click', closeSheet);
sheetMask.addEventListener('click', e => { if (e.target === sheetMask) closeSheet(); });

$('#sheetGrid').addEventListener('click', e => {
  const item = e.target.closest('[data-block]');
  if (!item) return;
  const type = item.dataset.block;
  closeSheet();
  setTimeout(() => addBlock(type), 180);
});

function addBlock(type) {
  const b = makeBlock(type);
  if (!b) return;
  S.blocks.push(b);
  S.selectedId = b.id;
  renderBlocks();
  queueSave();
  const node = blocksEl.querySelector('[data-id="' + b.id + '"]');
  if (node) {
    node.scrollIntoView({ behavior: 'smooth', block: 'center' });
    const focusable = node.querySelector('[contenteditable]');
    if (focusable) setTimeout(() => focusable.focus(), 260);
  }
}

/* =========================================================
   header bindings
   ========================================================= */
function bindHeader() {
  const logo = $('#logoEl'), name = $('#nameEl'), sub = $('#subEl'), bio = $('#bioEl');
  bindEditable(logo, v => { S.logo = v; queueSave(); }, true);
  bindEditable(name, v => { S.name = v; queueSave(); }, true);
  bindEditable(sub, v => { S.subtitle = v; queueSave(); }, false);
  bindEditable(bio, v => { S.bio = v; queueSave(); }, false);
}

$('#avatar').addEventListener('click', async e => {
  if (editorEl.classList.contains('clean')) return;
  if (e.target.closest('#avatarDel')) return;
  const urls = await pickImages(false, 420);
  if (urls.length) { S.avatar = urls[0]; renderAvatar(); queueSave(); }
});
$('#avatarDel').addEventListener('click', e => {
  e.stopPropagation();
  S.avatar = '';
  renderAvatar();
  queueSave();
});

/* =========================================================
   background panel
   ========================================================= */
const bgMask = $('#bgMask');
function openBg() { closePop(); bgMask.classList.add('on'); syncBgUI(); }
function closeBg() { bgMask.classList.remove('on'); }

$('#bgBtn').addEventListener('click', openBg);
$('#bgClose').addEventListener('click', closeBg);
bgMask.addEventListener('click', e => { if (e.target === bgMask) closeBg(); });

$('#bgPresets').addEventListener('click', e => {
  const t = e.target.closest('.bg-tile');
  if (!t) return;
  const bg = bgState();
  bg.image = '';
  bg.color = t.dataset.color;
  if (t.dataset.dot) bg.dotColor = t.dataset.dot;
  bg.dots = t.dataset.dots === '1';
  bg.dark = hexLum(bg.color) < 0.5;
  applyBg();
  queueSave();
});

$('#bgColor').addEventListener('input', e => {
  const bg = bgState();
  bg.image = '';
  bg.color = e.target.value;
  bg.dark = hexLum(bg.color) < 0.5;
  applyBg();
  queueSave();
});

$('#bgDot').addEventListener('input', e => {
  const bg = bgState();
  bg.dotColor = e.target.value;
  if (!bg.dots) bg.dots = true;
  bg.image = '';
  applyBg();
  queueSave();
});

$('#bgDots').addEventListener('change', e => {
  const bg = bgState();
  bg.image = '';
  bg.dots = e.target.checked;
  bg.dark = hexLum(bg.color) < 0.5;
  applyBg();
  queueSave();
});

$('#bgUpload').addEventListener('click', async () => {
  const urls = await pickImages(false, 1600);
  if (!urls.length) return;
  const bg = bgState();
  bg.image = urls[0];
  bg.dark = await imageIsDark(bg.image);
  applyBg();
  queueSave();
});

$('#fontChips').addEventListener('click', e => {
  const chip = e.target.closest('[data-font]');
  if (!chip) return;
  S.font = chip.dataset.font;
  applyFont();
  queueSave();
});

$('#bgOpacity').addEventListener('input', e => {
  const v = +e.target.value;
  $('#bgOpVal').textContent = v + '%';
  (S.blocks || []).forEach(b => {
    if (b.type === 'image') return;
    b.opacity = v >= 100 ? null : v;
    const wrap = blocksEl.querySelector('[data-id="' + b.id + '"]');
    if (!wrap) return;
    const c = wrap.querySelector('.block-content');
    if (c) c.style.opacity = (v / 100).toFixed(2);
    const btn = wrap.querySelector('[data-act="opacity"]');
    if (btn) btn.classList.toggle('on', v < 100);
  });
  queueSave();
});

$('#bgClear').addEventListener('click', () => {
  const bg = bgState();
  bg.image = '';
  bg.dark = hexLum(bg.color) < 0.5;
  applyBg();
  queueSave();
});

/* =========================================================
   preview / clean mode
   ========================================================= */
let previewing = false;
$('#pvBtn').addEventListener('click', () => {
  previewing = !previewing;
  editorEl.classList.toggle('clean', previewing);
  $('#pvBtn').querySelector('span').textContent = previewing ? '返回编辑' : '预览';
  if (previewing) { deselect(); document.activeElement && document.activeElement.blur(); }
});

/* =========================================================
   reset
   ========================================================= */
$('#btnReset').addEventListener('click', async () => {
  const ok = await confirmDialog('重置这一页？', '板块、头像和简介都会清空，名字保留。', '确认重置');
  if (!ok) return;
  const name = S.name;
  S = blankState(name);
  renderAll();
  saveNow();
  toast('已重置');
});

function confirmDialog(title, desc, okText) {
  return new Promise(resolve => {
    const mask = el('div', 'mask dialog-mask');
    mask.innerHTML = '<div class="dialog"><h3></h3><p></p><div class="dialog-btns">'
      + '<button class="btn ghost" data-v="0">取消</button>'
      + '<button class="btn dark" data-v="1"></button></div></div>';
    $('h3', mask).textContent = title;
    $('p', mask).textContent = desc;
    $('[data-v="1"]', mask).textContent = okText || '确定';
    document.body.appendChild(mask);
    requestAnimationFrame(() => mask.classList.add('on'));
    mask.addEventListener('click', e => {
      const b = e.target.closest('[data-v]');
      if (!b && e.target !== mask) return;
      const v = b ? b.dataset.v === '1' : false;
      mask.classList.remove('on');
      setTimeout(() => mask.remove(), 240);
      resolve(v);
    });
  });
}

/* =========================================================
   export to image
   ========================================================= */
function getFontEmbedCSS() {
  let css = '';
  for (const sheet of Array.from(document.styleSheets)) {
    try {
      for (const rule of Array.from(sheet.cssRules || [])) {
        const txt = rule.cssText || '';
        if (txt.indexOf('@font-face') === 0) css += txt + '\n';
      }
    } catch (e) { /* cross-origin */ }
  }
  return css;
}

async function exportImage() {
  const btn = $('#btnSave');
  if (btn.dataset.busy) return;
  btn.dataset.busy = '1';
  const oldLabel = btn.textContent;
  btn.textContent = '正在生成…';

  closePop();
  closeSheet();
  closeBg();
  deselect();
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  const sel = window.getSelection();
  if (sel) sel.removeAllRanges();

  const wasPreview = previewing;
  editorEl.classList.add('clean');
  if (btn) btn.style.visibility = 'hidden';
  const prevMinH = cardEl.style.minHeight;
  cardEl.style.minHeight = '480px';

  await sleep(90);
  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    await sleep(40);

    if (!window.htmlToImage) await loadExportLib();

    let dataUrl;
    if (window.htmlToImage) {
      dataUrl = await window.htmlToImage.toPng(cardEl, {
        pixelRatio: 2,
        fontEmbedCSS: getFontEmbedCSS(),
        cacheBust: false
      });
    } else {
      throw new Error('导出组件未加载');
    }
    download(dataUrl);
    toast('已保存为图片');
  } catch (err) {
    console.error(err);
    toast(err && err.message === '导出组件未加载' ? '保存组件加载失败，请检查网络后重试' : '生成失败，请重试');
  } finally {
    editorEl.classList.toggle('clean', wasPreview);
    cardEl.style.minHeight = prevMinH;
    btn.style.visibility = '';
    btn.textContent = oldLabel;
    delete btn.dataset.busy;
  }
}

function loadExportLib() {
  return new Promise(resolve => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js';
    s.onload = () => resolve(true);
    s.onerror = () => resolve(false);
    document.head.appendChild(s);
    setTimeout(() => resolve(false), 4000);
  });
}

function download(dataUrl) {
  const safe = (S.name || 'litpage').replace(/[\\/:*?"<>|\s]+/g, '-').slice(0, 24) || 'litpage';
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = safe + '-litpage.png';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

$('#btnSave').addEventListener('click', exportImage);

/* =========================================================
   global interactions
   ========================================================= */
document.addEventListener('pointerdown', e => {
  if (!popNode) return;
  if (e.target.closest('.pop') || e.target.closest('.blk-btn-icon')) return;
  closePop();
});

document.addEventListener('pointerdown', e => {
  if (!S) return;
  if (e.target.closest('.block') || e.target.closest('.tb') || e.target.closest('.pop')) return;
  if (e.target.closest('.hfield')) return;
  deselect();
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  closePop();
  closeSheet();
  closeBg();
  deselect();
});

/* =========================================================
   boot
   ========================================================= */
function boot() {
  bindHeader();
  ['#logoEl', '#nameEl', '#subEl', '#bioEl'].forEach(sel => syncEmpty($(sel)));

  const saved = readDraft();
  const hasContent = saved && (saved.name || (saved.blocks && saved.blocks.length) || saved.bio || saved.avatar || saved.logo);
  if (hasContent) {
    // 只有第一次进来需要填名字，之后直接回到编辑页
    draft = saved;
    S = normalizeDraft(saved);
    showEditorScreen();
  } else {
    initWelcome();
  }
  if (!window.htmlToImage) console.warn('html-to-image 未加载，保存功能不可用');
}
boot();
